# This Blueprint intentionally creates ONLY the Video AI service.
# Keep the existing backend and Core AI services; do not duplicate them.
# During Blueprint setup, provide the SAME AI_SERVICE_SECRET_KEY value
# already configured on the existing backend and Core AI service.
services:
  - type: web
    name: interviewx-ai-video
    env: docker
    plan: free
    region: oregon
    dockerContext: ai-service
    dockerfilePath: ai-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: AI_SERVICE_MODE
        value: video
      - key: AI_SERVICE_SECRET_KEY
        sync: false
      - key: VIDEO_FRAME_SAMPLE_FPS
        value: "1"
      - key: VIDEO_MAX_FRAMES
        value: "8"
      - key: VIDEO_MAX_FRAME_DIM
        value: "384"
      - key: MAX_CONCURRENT_INFERENCES
        value: "1"
