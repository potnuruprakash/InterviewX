services:
  mongodb:
    image: mongo:7.0
    container_name: interviewx_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: interviewx
    networks:
      - interviewx_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service A: Core AI Service (SBERT + Librosa Audio)
  ai-service-core:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: interviewx_ai_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_SERVICE_MODE=core
      - AI_SERVICE_SECRET_KEY=${AI_SERVICE_SECRET_KEY:-default_internal_ai_secret_key_change_in_production}
      - BACKEND_ORIGIN=http://backend:5000
    networks:
      - interviewx_network

  # Service B: Video AI Service (YOLOv8 + MediaPipe)
  ai-service-video:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: interviewx_ai_video
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - AI_SERVICE_MODE=video
      - AI_SERVICE_SECRET_KEY=${AI_SERVICE_SECRET_KEY:-default_internal_ai_secret_key_change_in_production}
      - BACKEND_ORIGIN=http://backend:5000
      - VIDEO_FRAME_SAMPLE_FPS=1
      - VIDEO_MAX_FRAMES=60
      - VIDEO_MAX_FRAME_DIM=640
      - MAX_CONCURRENT_INFERENCES=1
    networks:
      - interviewx_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewx_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/interviewx
      - AI_SERVICE_URL=http://ai-service-core:8000
      - VIDEO_AI_SERVICE_URL=http://ai-service-video:8000
      - AI_SERVICE_SECRET_KEY=${AI_SERVICE_SECRET_KEY:-default_internal_ai_secret_key_change_in_production}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=http://localhost:80
      - CLIENT_URL=http://localhost:80
    volumes:
      - backend_uploads:/usr/src/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service-core:
        condition: service_started
      ai-service-video:
        condition: service_started
    networks:
      - interviewx_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: interviewx_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - interviewx_network

networks:
  interviewx_network:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
